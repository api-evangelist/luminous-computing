aid: luminous-computing
name: Luminous Computing
description: >-
  Luminous Computing (branded simply "Luminous") is a Mountain View, California silicon-photonics
  company founded in 2018 by Marcus Gomez (CEO), Mitchell Nahmias (CTO) and Michael Gao (chief
  strategist), building an optical AI supercomputer that replaces electrical interconnect with light
  to remove the data-movement bottleneck between compute and memory. The architecture derives from
  Nahmias' neuromorphic-photonics research at Princeton, and the company's stated goal is a
  photonics-based machine that delivers a step-function gain in AI training and inference throughput
  while simplifying the programming model. Luminous emerged from stealth in March 2022 with a $105M
  Series A backed by Bill Gates, Gigafund, 8090 Partners, Neo, Third Kind Venture Capital, Alumni
  Ventures, Strawberry Creek Ventures, Horsley Bridge and Modern Venture Partners, bringing total
  disclosed funding to roughly $123-126M across three rounds; silicon-photonics veteran Michael
  Hochberg (founder of Luxtera, acquired by Cisco, and Elenion, acquired by Nokia) joined as
  president of engineering and operations in 2023. Luminous is a semiconductor and systems company,
  not a software vendor - it publishes no developer portal, no API documentation, no SDK and no
  machine-readable API contract of any kind. Its public web presence is a single-page marketing site;
  as of August 2026 the company's own domain lmns.com returns a Squarespace "Website Expired" page
  while the underlying site remains reachable at the platform address luminous-co.squarespace.com,
  and lmns.com DNS is still actively operated (Google Workspace mail, plus Atlassian, Smartsheet and
  DocuSign domain verifications), indicating a lapsed marketing-site subscription rather than a
  wound-down company.
